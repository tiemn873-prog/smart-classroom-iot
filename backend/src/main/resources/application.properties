spring.config.import=optional:file:./backend-private.properties,optional:file:./backend/backend-private.properties
# =====================================================================================
#  CAU HINH BACKEND - SMART CLASSROOM
#  SV: Nguyen Dung Tiem - B23DCCN813
# =====================================================================================

server.port=8080

# ---- MySQL ----
# createDatabaseIfNotExist=true: tu tao database smart_class neu chua co
spring.datasource.url=jdbc:mysql://localhost:3306/smart_class?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
# Tai khoan rieng cua ung dung, chi co quyen tren database smart_class.
# Tao bang khoi SQL trong README (khong dung root cho ung dung).
spring.datasource.username=smartclass
spring.datasource.password=${DB_PASSWORD:}

# Hibernate tu tao/cap nhat bang theo cac @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Bat dong nay khi muon xem cau lenh SQL that trong log
spring.jpa.show-sql=false

# ---- MQTT Broker (Mosquitto) ----
mqtt.broker-url=tcp://localhost:8813
mqtt.username=NguyenDungTiem
mqtt.password=${MQTT_PASSWORD:}
mqtt.client-id=BACKEND_SPRING_01

# ---- Dieu khien thiet bi ----
# Thoi gian Backend cho ESP32 bao trang thai thuc te truoc khi ket luan TIMEOUT.
# Che do mot pha: ESP32 thuc thi ngay, binh thuong tra loi trong ~0.1-1s.
# Qua 3s khong thay hoi am nghia la ESP32 mat dien hoac rot mang.
app.control.timeout-ms=3000

# ---- Ghi log ----
logging.level.vn.ptit.smartclass=INFO
